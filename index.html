<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partille Goes Barsebäck</title>

    <style>
        :root {
            --dark-green: #071b16;
            --green: #0d3328;
            --light-green: #1f694d;
            --gold: #d8b45a;
            --cream: #f4f0df;
            --text-light: #eef3ed;
            --muted: #bacabd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(rgba(4, 19, 14, 0.88), rgba(4, 19, 14, 0.93)),
                url("https://images.unsplash.com/photo-1587174486073-ae5e5cff23aa?auto=format&fit=crop&w=2000&q=80")
                center / cover fixed;
            color: var(--text-light);
            min-height: 100vh;
        }

        /* Vänstermenyn */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            padding: 30px 22px;
            background: rgba(3, 17, 13, 0.96);
            border-right: 1px solid rgba(216, 180, 90, 0.35);
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        .logo {
            width: 100%;
            max-width: 190px;
            height: 120px;
            object-fit: contain;
            margin: 0 auto 28px;
            border-radius: 8px;
            background: white;
            padding: 8px;
        }

        .temporary-logo-text {
            color: var(--gold);
            font-size: 12px;
            text-align: center;
            margin-top: -20px;
            margin-bottom: 25px;
            opacity: 0.85;
        }

        .event-name {
            text-align: center;
            color: var(--cream);
            font-family: Georgia, serif;
            font-size: 22px;
            line-height: 1.15;
            margin-bottom: 35px;
        }

        .event-name span {
            display: block;
            color: var(--gold);
            font-size: 13px;
            letter-spacing: 3px;
            margin-top: 8px;
            font-family: Arial, sans-serif;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        nav a {
            color: var(--muted);
            text-decoration: none;
            padding: 14px 16px;
            border-left: 3px solid transparent;
            transition: 0.25s ease;
            letter-spacing: 1px;
            font-weight: bold;
        }

        nav a:hover,
        nav a.active {
            color: white;
            background: rgba(216, 180, 90, 0.12);
            border-left-color: var(--gold);
            transform: translateX(4px);
        }
